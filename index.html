<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Голосовой ИИ Ассистент (24/7)</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            padding: 20px; 
            max-width: 600px; 
            margin: 0 auto; 
            background-color: #f4f4f9;
        }
        button { 
            padding: 15px 30px; 
            font-size: 18px; 
            cursor: pointer; 
            background-color: #007bff; 
            color: white; 
            border: none; 
            border-radius: 8px; 
            width: 100%;
            margin-bottom: 10px;
        }
        button.active { background-color: #dc3545; }
        #status { 
            text-align: center; 
            font-style: italic; 
            color: #666; 
            margin-bottom: 20px;
        }
        .chat-box { 
            background: white; 
            padding: 20px; 
            border-radius: 8px; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.1); 
            min-height: 150px; 
        }
        .chat-box p { margin: 10px 0; line-height: 1.5; }
    </style>
</head>
<body>

    <h1>Голосовой Ассистент</h1>
    
    <button id="startBtn">🎤 Начать слушать (24/7)</button>
    <div id="status">Нажмите кнопку для запуска</div>

    <div class="chat-box">
        <p><strong>Вы:</strong> <span id="userText">...</span></p>
        <p><strong>ИИ:</strong> <span id="aiText">...</span></p>
    </div>

    <script>
        const GROQ_API_KEY = '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'; 
        
        const startBtn = document.getElementById('startBtn');
        const statusDiv = document.getElementById('status');
        const userTextSpan = document.getElementById('userText');
        const aiTextSpan = document.getElementById('aiText');

        let isActive = false; // Флаг режима 24/7
        let isSpeaking = false; // Флаг озвучки ответа

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        
        if (!SpeechRecognition) {
            alert("Ваш браузер не поддерживает распознавание речи.");
        } else {
            const recognition = new SpeechRecognition();
            recognition.lang = 'ru-RU';
            recognition.interimResults = false;
            recognition.continuous = false; // Оставляем false, чтобы быстрее отправлять готовые фразы

            // Кнопка теперь работает как переключатель Вкл/Выкл
            startBtn.addEventListener('click', () => {
                if (!isActive) {
                    isActive = true;
                    isSpeaking = false;
                    startBtn.innerText = '🛑 Остановить прослушивание';
                    startBtn.classList.add('active');
                    recognition.start();
                    statusDiv.innerText = 'Слушаю вас непрерывно...';
                } else {
                    isActive = false;
                    startBtn.innerText = '🎤 Начать слушать (24/7)';
                    startBtn.classList.remove('active');
                    recognition.stop();
                    statusDiv.innerText = 'Остановлено';
                }
            });

            recognition.onresult = async (event) => {
                const text = event.results[0][0].transcript.trim();
                if (!text) return;

                userTextSpan.innerText = text;
                statusDiv.innerText = 'Отправляю запрос...';
                
                await getAIResponse(text);
            };

            // Как только микрофон отключается, запускаем его снова (если включен режим 24/7 и ИИ не говорит)
            recognition.onend = () => {
                if (isActive && !isSpeaking) {
                    try {
                        recognition.start();
                    } catch (e) {
                        console.log("Ожидание перезапуска микрофона...");
                    }
                }
            };

            recognition.onerror = (event) => {
                if (event.error !== 'no-speech') {
                    statusDiv.innerText = 'Ошибка: ' + event.error;
                }
            };

            async function getAIResponse(userMessage) {
                try {
                    const response = await fetch('https://api.groq.com/openai/v1/chat/completions', {
                        method: 'POST',
                        headers: {
                            'Authorization': `Bearer ${GROQ_API_KEY}`,
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            model: "llama3-8b-8192",
                            messages: [{ role: "user", content: userMessage }]
                        })
                    });

                    if (!response.ok) throw new Error('Ошибка API');

                    const data = await response.json();
                    const aiMessage = data.choices[0].message.content;
                    
                    aiTextSpan.innerText = aiMessage;
                    speak(aiMessage); 
                } catch (error) {
                    statusDiv.innerText = 'Ошибка сети. Слушаю дальше...';
                    // Если ошибка, сразу продолжаем слушать
                    if (isActive && !isSpeaking) recognition.start();
                }
            }

            function speak(text) {
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'ru-RU';
                utterance.rate = 1.1;
                
                // Ставим микрофон на паузу, пока ИИ говорит
                utterance.onstart = () => {
                    isSpeaking = true;
                    recognition.stop(); 
                    statusDiv.innerText = 'ИИ отвечает... (микрофон на паузе)';
                };

                // Возобновляем прослушивание, когда ИИ закончил говорить
                utterance.onend = () => {
                    isSpeaking = false;
                    if (isActive) {
                        try {
                            recognition.start();
                            statusDiv.innerText = 'Слушаю вас непрерывно...';
                        } catch (e) {}
                    }
                };

                window.speechSynthesis.speak(utterance);
            }
        }
    </script>
</body>
</html>
