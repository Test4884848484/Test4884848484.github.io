<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Голосовой ИИ Ассистент</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            padding: 20px; 
            max-width: 600px; 
            margin: 0 auto; 
            background-color: #f4f4f9;
        }
        button { 
            padding: 15px 30px; 
            font-size: 18px; 
            cursor: pointer; 
            background-color: #007bff; 
            color: white; 
            border: none; 
            border-radius: 8px; 
            width: 100%;
            margin-bottom: 10px;
        }
        button:active { background-color: #0056b3; }
        #status { 
            text-align: center; 
            font-style: italic; 
            color: #666; 
            margin-bottom: 20px;
        }
        .chat-box { 
            background: white; 
            padding: 20px; 
            border-radius: 8px; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.1); 
            min-height: 150px; 
        }
        .chat-box p { margin: 10px 0; line-height: 1.5; }
        .warning {
            background-color: #fff3cd;
            color: #856404;
            padding: 10px;
            border-radius: 5px;
            font-size: 14px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

    <h1>Голосовой Ассистент</h1>
    
    <div class="warning">
        <strong>Внимание:</strong> Для работы нужно вставить API-ключ Groq в исходный код. Никогда не публикуйте этот файл в интернете с вашим ключом!
    </div>
    
    <button id="startBtn">🎤 Начать говорить</button>
    <div id="status">Нажмите кнопку и разрешите доступ к микрофону</div>

    <div class="chat-box">
        <p><strong>Вы:</strong> <span id="userText">...</span></p>
        <p><strong>ИИ:</strong> <span id="aiText">...</span></p>
    </div>

    <script>
        // === ВАЖНО: Вставьте ваш API-ключ Groq сюда ===
        const GROQ_API_KEY = 'ВСТАВЬТЕ_ВАШ_КЛЮЧ_СЮДА'; 
        
        const startBtn = document.getElementById('startBtn');
        const statusDiv = document.getElementById('status');
        const userTextSpan = document.getElementById('userText');
        const aiTextSpan = document.getElementById('aiText');

        // Инициализация Web Speech API для распознавания речи
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        
        if (!SpeechRecognition) {
            alert("Ваш браузер не поддерживает распознавание речи. Попробуйте Google Chrome на Android или ПК.");
        } else {
            const recognition = new SpeechRecognition();
            recognition.lang = 'ru-RU'; // Устанавливаем русский язык
            recognition.interimResults = false;

            // Обработчик нажатия на кнопку
            startBtn.addEventListener('click', () => {
                recognition.start();
                statusDiv.innerText = 'Слушаю вас...';
                aiTextSpan.innerText = '...';
            });

            // Когда речь распознана
            recognition.onresult = async (event) => {
                const text = event.results[0][0].transcript;
                userTextSpan.innerText = text;
                statusDiv.innerText = 'Отправляю запрос в нейросеть...';
                
                await getAIResponse(text);
            };

            recognition.onspeechend = () => {
                recognition.stop();
            };

            recognition.onerror = (event) => {
                statusDiv.innerText = 'Ошибка микрофона: ' + event.error;
            };
        }

        // Функция отправки текста в Groq (модель Llama 3)
        async function getAIResponse(userMessage) {
            if (GROQ_API_KEY === 'ВСТАВЬТЕ_ВАШ_КЛЮЧ_СЮДА') {
                statusDiv.innerText = 'Ошибка: Вы забыли вставить API-ключ в код.';
                return;
            }

            try {
                const response = await fetch('https://api.groq.com/openai/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${GROQ_API_KEY}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        model: "llama3-8b-8192", // Одна из самых быстрых моделей
                        messages: [{ role: "user", content: userMessage }]
                    })
                });

                if (!response.ok) throw new Error('Ошибка при обращении к API');

                const data = await response.json();
                const aiMessage = data.choices[0].message.content;
                
                aiTextSpan.innerText = aiMessage;
                statusDiv.innerText = 'Готово';
                
                speak(aiMessage); // Озвучиваем ответ
            } catch (error) {
                statusDiv.innerText = 'Ошибка: ' + error.message;
            }
        }

        // Инициализация Web Speech API для синтеза речи (озвучки)
        function speak(text) {
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'ru-RU'; // Говорим по-русски
            utterance.rate = 1.1; // Чуть ускоряем речь для динамичности
            window.speechSynthesis.speak(utterance);
        }
    </script>
</body>
</html>
